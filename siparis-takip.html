<!DOCTYPE html>
<html lang="tr">
<head>
  <base href="/">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sipariş Takibi | Evseren Mobilya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css?v=20261105j" />
  <style>
    body { background: #faf7f2; }
    .track-hero {
      background: linear-gradient(135deg, #1a1209 0%, #2c2016 100%);
      padding: 80px 0 65px;
      text-align: center;
      color: white;
    }
    .track-form-container {
      max-width: 560px;
      margin: -42px auto 36px;
      padding: 28px 32px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 18px 42px rgba(26, 18, 9, 0.1);
      border: 1px solid #ece2d0;
      position: relative;
      z-index: 10;
    }
    .track-input-row {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }
    .track-input-row input {
      flex: 1;
      padding: 14px 18px;
      border: 1.5px solid #dfd5c6;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      color: #1a1209;
      outline: none;
      transition: 0.25s;
    }
    .track-input-row input:focus {
      border-color: #B8860B;
      box-shadow: 0 0 0 3px rgba(184, 134, 11, 0.12);
    }

    /* SİPARİŞ TAKİP KARTI VE YATAY TIMELINE */
    .order-tracking-card {
      max-width: 920px;
      margin: 0 auto 50px;
      background: #ffffff;
      border-radius: 20px;
      padding: 36px 38px;
      box-shadow: 0 16px 40px rgba(26, 18, 9, 0.07);
      border: 1px solid #e8decb;
    }
    .tracking-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding-bottom: 24px;
      border-bottom: 1px solid #f0e8da;
      margin-bottom: 36px;
    }
    .tracking-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 50px;
      background: linear-gradient(135deg, #1b5e20, #2e7d32);
      color: #fff;
      font-weight: 700;
      font-size: 0.92rem;
      box-shadow: 0 6px 16px rgba(46, 125, 50, 0.25);
    }
    .tracking-timeline {
      position: relative;
      margin: 20px 0 40px;
      padding: 0 10px;
    }
    .timeline-line {
      position: absolute;
      top: 26px;
      left: 50px;
      right: 50px;
      height: 5px;
      background: #e6dfd3;
      border-radius: 10px;
      z-index: 1;
    }
    .timeline-progress {
      position: absolute;
      top: 26px;
      left: 50px;
      height: 5px;
      background: linear-gradient(90deg, #B8860B, #2e7d32);
      border-radius: 10px;
      z-index: 2;
      transition: width 0.5s ease;
    }
    .timeline-steps {
      position: relative;
      z-index: 3;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      text-align: center;
    }
    .timeline-steps .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .timeline-steps .step-circle {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: #f5f0e6;
      border: 3px solid #dcd2c2;
      color: #8c7f70;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      transition: all 0.3s ease;
    }
    .timeline-steps .step.completed .step-circle {
      background: #2e7d32;
      border-color: #2e7d32;
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(46, 125, 50, 0.28);
    }
    .timeline-steps .step.active .step-circle {
      background: #B8860B;
      border-color: #1a1209;
      color: #ffffff;
      transform: scale(1.12);
      box-shadow: 0 0 0 6px rgba(184, 134, 11, 0.2);
    }
    .timeline-steps .step-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #7d7065;
    }
    .timeline-steps .step.completed .step-label {
      color: #1b5e20;
      font-weight: 700;
    }
    .timeline-steps .step.active .step-label {
      color: #B8860B;
      font-weight: 800;
    }
    .step-active-tag {
      display: inline-block;
      margin-top: 2px;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      background: #fff3e0;
      color: #e65100;
    }
    .tracking-details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      background: #faf7f2;
      padding: 20px 24px;
      border-radius: 14px;
      border: 1px solid #ede4d4;
      margin-top: 20px;
    }
    @media (max-width: 720px) {
      .track-input-row { flex-direction: column; }
      .timeline-line, .timeline-progress { display: none; }
      .timeline-steps { grid-template-columns: 1fr; text-align: left; gap: 16px; }
      .timeline-steps .step { flex-direction: row; }
      .tracking-details-grid { grid-template-columns: 1fr; }
    }
  </style>
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png?v=20261105">
  <link rel="shortcut icon" href="/favicon.ico?v=20261105">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20261105">
  <link rel="stylesheet" href="chatbot.css?v=20261105j" />
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <img src="images/logo.jpeg" alt="Evseren Mobilya" style="height: 60px; width: auto; max-width: 100%; object-fit: contain; mix-blend-mode: multiply;" />
      </a>
      <nav class="nav">
        <ul class="nav-list">
          <li><a href="index.html" class="nav-link">Ana Sayfa</a></li>
          <li><a href="products.html" class="nav-link">Ürünler</a></li>
          <li><a href="track-order.html" class="nav-link active">Sipariş Takibi</a></li>
          <li><a href="about.html" class="nav-link">Hakkımızda</a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <a href="login.html" class="icon-btn" id="userBtn"><i class="fas fa-user"></i></a>
        <button class="icon-btn cart-btn" id="cartBtn">
          <i class="fas fa-shopping-bag"></i>
          <span class="cart-count" id="cartCount">0</span>
        </button>
      </div>
    </div>
  </header>

  <section class="track-hero">
    <h1 style="font-family:var(--font-heading); font-size:2.6rem; margin-bottom:8px;">Canlı Sipariş & Kargo Takibi</h1>
    <p style="color:rgba(255,255,255,0.78)">Sipariş kodunuzu girerek üretim, hazırlık ve sevkiyat aşamalarını anlık takip edin.</p>
  </section>

  <section class="section" style="padding: 20px 0 70px;">
    <div class="container">
      <div class="track-form-container">
        <label style="display:block; font-weight:700; color:#1a1209; font-size:0.92rem;">Sipariş Kodunuz (Örn: EVS-377600)</label>
        <div class="track-input-row">
          <input type="text" id="orderCodeInput" placeholder="EVS-XXXXXX" onkeypress="if(event.key==='Enter') trackMyOrder()" />
          <button onclick="trackMyOrder()" class="btn btn-primary" style="padding:14px 28px; white-space:nowrap;">Siparişi Sorgula</button>
        </div>
      </div>

      <div id="trackingResult">
        <div style="text-align:center; padding:50px 20px; color:var(--text-light)">
           <i class="fas fa-truck-loading" style="font-size:3rem; margin-bottom:16px; opacity:0.35; color:#8b5e3c;"></i>
           <p>Sipariş durumunu görüntülemek için yukarıdaki alana sipariş kodunuzu girin.</p>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer" style="background:var(--dark2); color:white; padding:36px 0; text-align:center;">
    <p>© 2026 Evseren Mobilya - Tüm hakları saklıdır.</p>
  </footer>

  <script src="script.js?v=20261105k"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const urlCode = params.get('code');
      const inputEl = document.getElementById('orderCodeInput');
      if (urlCode && inputEl) {
        inputEl.value = urlCode;
        trackMyOrder();
      } else {
        try {
          const orders = JSON.parse(localStorage.getItem('evseren_orders') || '[]');
          if (orders.length > 0 && orders[0].orderCode && inputEl) {
            inputEl.value = orders[0].orderCode;
            trackMyOrder();
          }
        } catch(e) {}
      }

      // Yönetici panelinde sipariş durumu güncellendiğinde bu sayfayı da anında canlı güncelle
      window.addEventListener('storage', (e) => {
        if (e.key === 'evseren_orders' && inputEl && inputEl.value.trim()) {
          trackMyOrder();
        }
      });
    });
  </script>
  <script src="chatbot.js?v=20261105j"></script>
</body>
</html>
